<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coins · Witness JS sample</title>
  <style>
    :root { color-scheme: dark; --bg: #0b0d16; --panel: #141828; --ink: #e8ecf8; --dim: #8a93b0; --gold: #ffd23c; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { background: radial-gradient(ellipse at 50% 30%, #1a1f36 0%, var(--bg) 70%); color: var(--ink);
      font: 15px/1.5 system-ui, "Segoe UI", sans-serif; display: grid; place-items: center; }
    main { display: grid; gap: 14px; justify-items: center; padding: 16px; width: min(100%, 1000px); }
    header { display: flex; align-items: baseline; justify-content: space-between; width: 100%; max-width: 960px; }
    h1 { margin: 0; font-size: 20px; letter-spacing: .12em; font-weight: 700; }
    .score { font-variant-numeric: tabular-nums; color: var(--gold); font-weight: 700; }
    canvas { width: 100%; max-width: 960px; aspect-ratio: 16 / 9; image-rendering: pixelated; display: block;
      border-radius: 10px; background: #141828; box-shadow: 0 0 0 1px #262c47, 0 24px 60px -20px #000; outline: none; }
    p { margin: 0; color: var(--dim); font-size: 13px; text-align: center; }
    kbd { background: var(--panel); border: 1px solid #2a3150; border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; font: 12px ui-monospace, monospace; color: var(--ink); }
  </style>
</head>
<body>
  <main>
    <header><h1>COINS</h1><span>score <span class="score" id="score">0</span></span></header>
    <canvas id="game" width="320" height="180"></canvas>
    <p>Move with <kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd><kbd>↓</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>.
       Open with <kbd>?witness_record=/__witness/record</kbd> to record a replay (<kbd>F8</kbd> marks a moment).</p>
  </main>
  <script type="module" src="game.js"></script>
</body>
</html>
