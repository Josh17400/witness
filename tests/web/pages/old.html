<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Old adapter</title></head>
<body style="margin:0;background:#000">
  <!-- A canvas game wired to the 0.7.4 JS adapter (vendored copy), with no reset handler: a newer CLI must still run
       its tests (a fresh page per test, as 0.7.4 did) instead of failing every reset. -->
  <canvas id="c" width="160" height="90"></canvas>
  <script type="module">
    import witness from "/witness/witness-074.js";
    const g = { x: 0, frames: 0 }, ctx = document.getElementById("c").getContext("2d");
    function loop() { g.frames++; g.x = (g.x + 1) % 160; ctx.fillStyle = "#000"; ctx.fillRect(0, 0, 160, 90); ctx.fillStyle = "#fc0"; ctx.fillRect(g.x, 40, 10, 10); requestAnimationFrame(loop); }
    requestAnimationFrame(loop);
    witness.start({ name: "old adapter", fps: 60, size: [160, 90], snapshot: () => ({ x: g.x, frames: g.frames }) });
  </script>
</body>
</html>
