name: adapter-godot-csharp

on:
  push:
    paths: ["adapters/godot-csharp/**", "adapters/csharp/Witness.cs", "examples/godot-csharp/**", "examples/coins.witness.json", "bin/**", "src/**", ".github/workflows/adapter-godot-csharp.yml"]
  pull_request:
    paths: ["adapters/godot-csharp/**", "adapters/csharp/Witness.cs", "examples/godot-csharp/**", "examples/coins.witness.json", "bin/**", "src/**", ".github/workflows/adapter-godot-csharp.yml"]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  coins:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/godot-csharp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: shared test and adapter copies are in sync
        run: |
          cmp ../coins.witness.json witness/coins.witness.json
          cmp ../../adapters/csharp/Witness.cs addons/witness/Witness.cs
          cmp ../../adapters/godot-csharp/WitnessNode.cs addons/witness/WitnessNode.cs
      - name: install Godot (.NET)
        run: |
          curl -sSL -o "$RUNNER_TEMP/godot.zip" "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          echo "GODOT=$RUNNER_TEMP/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64" >> "$GITHUB_ENV"
      - name: build and import
        run: |
          dotnet build Coins.csproj --nologo -v q
          "$GODOT" --headless --path . --import
      - name: witness doctor
        run: node ../../bin/witness.js doctor --timeout 120 --cmd "$GODOT --headless --path . --fixed-fps 60"
      - name: witness test
        run: node ../../bin/witness.js test --timeout 120 --cmd "$GODOT --headless --path . --fixed-fps 60"
      - name: variable-dt replay (Engine.TimeScale per frame)
        run: |
          node ../../bin/witness.js replay ../../tests/mock/session.jsonl --timeout 120 --cmd "$GODOT --headless --path . --fixed-fps 60" | tee replay.txt
          grep -qF "pos=[120.4,90]" replay.txt
