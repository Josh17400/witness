name: adapter-lumen

# Lumen lives in its own repository. Set the repository variable LUMEN_REPO (owner/name, and
# optionally LUMEN_REF) to run this job; without it the job explains why it was skipped.
on:
  push:
    paths: ["adapters/lumen/**", "examples/lumen/**", "bin/**", "src/**", ".github/workflows/adapter-lumen.yml"]
  pull_request:
    paths: ["adapters/lumen/**", "examples/lumen/**", "bin/**", "src/**", ".github/workflows/adapter-lumen.yml"]
  workflow_dispatch:

jobs:
  neon-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Lumen repository configured?
        id: cfg
        run: |
          if [ -z "${{ vars.LUMEN_REPO }}" ]; then
            echo "::notice::LUMEN_REPO is not set, so the Lumen bridge can't be tested here (verified locally only)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.run == 'true'
        with:
          path: witness
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.run == 'true'
        with:
          repository: ${{ vars.LUMEN_REPO }}
          ref: ${{ vars.LUMEN_REF || '' }}
          path: lumen
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.run == 'true'
        with:
          node-version: 22
      - name: install Lumen (Electron) and its X/GL runtime libraries
        if: steps.cfg.outputs.run == 'true'
        working-directory: lumen
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libnss3 libxss1 libasound2t64 libgbm1
          npm ci
          node build.mjs
          node --check src/desktop/main.cjs
          node tests/run.mjs
      - name: syntax
        if: steps.cfg.outputs.run == 'true'
        working-directory: witness
        run: node --check adapters/lumen/witness-lumen.mjs && node --check adapters/lumen/lumen-replay.mjs
      - name: witness doctor
        if: steps.cfg.outputs.run == 'true'
        working-directory: witness/examples/lumen
        run: xvfb-run -a node ../../bin/witness.js doctor
      - name: witness test
        if: steps.cfg.outputs.run == 'true'
        working-directory: witness/examples/lumen
        run: xvfb-run -a node ../../bin/witness.js test
