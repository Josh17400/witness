name: adapter-godot

on:
  push:
    paths: ["adapters/godot/**", "examples/godot/**", "examples/coins.witness.json", "bin/**", "src/**", ".github/workflows/adapter-godot.yml"]
  pull_request:
    paths: ["adapters/godot/**", "examples/godot/**", "examples/coins.witness.json", "bin/**", "src/**", ".github/workflows/adapter-godot.yml"]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  coins:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: examples/godot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: install Godot ${{ env.GODOT_VERSION }} + virtual display (Mesa llvmpipe for OpenGL 3.3)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglu1-mesa unzip
          curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 755 /tmp/godot/Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          godot --version
      - name: adapter copy and shared test are in sync
        run: |
          cmp ../../adapters/godot/Witness.gd addons/witness/Witness.gd
          cmp ../../adapters/godot/witness_logger.gd addons/witness/witness_logger.gd
          cmp ../coins.witness.json witness/coins.witness.json
      - name: witness doctor (headless, fastest)
        run: node ../../bin/witness.js doctor --cmd "godot --path . --headless --fixed-fps 60"
      - name: witness test (headless)
        run: node ../../bin/witness.js test --cmd "godot --path . --headless --fixed-fps 60"
      - name: witness doctor (OpenGL + Movie Maker audio, witness.json)
        run: xvfb-run -a node ../../bin/witness.js doctor
      - name: witness test (OpenGL + Movie Maker audio)
        run: xvfb-run -a node ../../bin/witness.js test
      - name: record a replay in normal play, then replay it exactly
        run: |
          out=$(WITNESS_RECORD=witness/replays/ci.jsonl WITNESS_SEED=4 godot --path . --headless -- --demo)
          echo "$out"
          x=$(echo "$out" | sed -n 's/.*player=(\([0-9.]*\),.*/\1/p')
          grep -q '"mark":"F8"' witness/replays/ci.jsonl
          node ../../bin/witness.js replay witness/replays/ci.jsonl --cmd "godot --path . --headless --fixed-fps 60" --watch "state.player.pos[0].toFixed(4)" | tee replay.txt
          grep -F "\"$x\"" replay.txt
          test -f witness/replays/ci.jsonl.state.json
          grep -F "ended in exactly the recorded end state" replay.txt
